name: Refresh CDSCO data

on:
  schedule:
    - cron: "30 2 * * 1"   # every Monday 08:00 IST
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental = last 3 months, backfill = everything since from_year"
        type: choice
        options: [incremental, backfill]
        default: incremental
      from_year:
        description: "First year for backfill"
        default: "2022"
      month_format:
        description: "How CDSCO expects the month parameter (confirm with the discovery report)"
        type: choice
        options: [number, name]
        default: number

permissions:
  contents: write
  issues: write

concurrency:
  group: cdsco-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CDSCO_BASE: ${{ vars.CDSCO_BASE || 'https://cdscoonline.gov.in' }}
      CDSCO_VERIFY_SSL: ${{ vars.CDSCO_VERIFY_SSL || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/cdsco/requirements.txt
      - run: pip install -r scripts/cdsco/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Unit tests
        run: python tests/test_normalize.py
      - name: Collect from CDSCO
        run: >
          python scripts/cdsco/collect.py
          --mode "${{ github.event.inputs.mode || 'incremental' }}"
          --from-year "${{ github.event.inputs.from_year || '2022' }}"
          --month-format "${{ github.event.inputs.month_format || 'number' }}"
      - name: Normalize and build index
        run: python scripts/cdsco/normalize.py
      - name: Summary
        if: always()
        run: |
          if [ -f data/changes.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          c = json.load(open("data/changes.json"))
          print(f"### CDSCO refresh\n\nNew records: **{c['newCount']}** | Watchlist hits: **{len(c['watchlistHits'])}**\n")
          for h in c["watchlistHits"]:
              print(f"- {h['drug']} ({h['company']}, {h['date']}) - {h['decision']} - matched {', '.join(h['matched'])}")
          PY
          fi
      - name: Commit data
        run: |
          git config user.name "cdsco-bot"
          git config user.email "cdsco-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes"; else
            git commit -m "Data refresh $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push
          fi
      - name: Open an issue for watchlist hits (GitHub emails you)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          c = json.load(open("data/changes.json"))
          hits = c["watchlistHits"]
          if hits:
              lines = [f"- **{h['drug']}** - {h['company']} - {h['date']} - {h['decision']} - [source]({h['sourceUrl']})" for h in hits]
              body = "New CDSCO records matching your watchlist:\n\n" + "\n".join(lines)
              subprocess.run(["gh", "issue", "create", "--title", f"CDSCO watchlist: {len(hits)} new record(s)", "--body", body], check=False)
          PY
